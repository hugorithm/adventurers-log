[package]
name = "hugo-portfolio"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.14"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
shell-words = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["fs", "limit"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"